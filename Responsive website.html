<!DOCTYPE html>
<html>
<head>
 
  <title>Responsive Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#333;
    }

    header{
      background:#0077ff;
      color:white;
      padding:15px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:15px;
      font-weight:bold;
    }

    .hero{
      height:80vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      background:linear-gradient(to right,
       #0077ff, #00c6ff);
      color:white;
      padding:20px;
    }

    .hero h1{
      font-size:48px;
      margin-bottom:10px;
    }

    .hero p{
      font-size:20px;
      margin-bottom:20px;
    }

    .btn{
      background:white;
      color:#0077ff;
      padding:12px 25px;
      border:none;
      border-radius:5px;
      text-decoration:none;
      font-weight:bold;
    }

    .container{
      padding:40px 20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      text-align:center;
    }

    .card h3{
      margin-bottom:10px;
      color:#0077ff;
    }

    footer{
      background:#222;
      color:white;
      text-align:center;
      padding:15px;
      margin-top:30px;
    }

    @media(max-width:768px){
      .hero h1{
        font-size:32px;
      }

      .hero p{
        font-size:16px;
      }

      .cards{
        grid-template-columns:1fr;
      }

      header{
        flex-direction:column;
        text-align:center;
      }

      nav{
        margin-top:10px;
      }
    }
  </style>
</head>
<body>

  
  <header>
    <h2>My Website</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  
  <section class="hero">
    <div>
      <h1>Welcome to My Website</h1>
      <p>Simple Responsive Frontend Design</p>
      <a href="#" class="btn">Get Started</a>
    </div>
  </section>

  
  <section class="container">
    <div class="cards">

      <div class="card">
        <h3>HTML</h3>
        <p>Structure your website easily.</p>
      </div>

      <div class="card">
        <h3>CSS</h3>
        <p>Style your website beautifully.</p>
      </div>

      <div class="card">
        <h3>Responsive</h3>
        <p>Works on mobile, tablet, and desktop.</p>
      </div>

    </div>
  </section>

  
  <footer>
    <p>© 2026 My Website | Frontend Development</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Simple React Single Page Layout</title>

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .navbar {
            background-color: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .hero {
            padding: 60px;
            text-align: center;
            background-color: #4CAF50;
            color: white;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        .footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #222;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">

        function App() {
            return (
                <div>

                    <div className="navbar">
                        <h1>My React Page</h1>
                    </div>

                    <div className="hero">
                        <h2>Welcome to React</h2>
                        <p>This is a simple single page layout.</p>
                        <button>Get Started</button>
                    </div>

                    <div className="content">
                        <h2>About</h2>
                        <p>
                            React helps build fast and interactive web applications.
                        </p>
                    </div>

                    <div className="footer">
                        <p>© 2026 My Website</p>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);

    </script>

</body>
</html>
